<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF4E4" />
      <stop offset="25%" stop-color="#D5BA8E" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="75%" stop-color="#A8885B" />
      <stop offset="100%" stop-color="#846536" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A880" />
      <stop offset="50%" stop-color="#FDF8EB" />
      <stop offset="100%" stop-color="#D5BA8E" />
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A8885B" />
      <stop offset="100%" stop-color="#5E4520" />
    </linearGradient>
    <radialGradient id="darkBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1C2026" />
      <stop offset="60%" stop-color="#141619" />
      <stop offset="100%" stop-color="#0B0D0F" />
    </radialGradient>
    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="105" fill="url(#darkBg)"/>
  
  <!-- Outer Double Gold Frame -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#goldLinear)" stroke-width="3" opacity="0.6"/>
  <rect x="36" y="36" width="440" height="440" rx="76" fill="none" stroke="url(#goldLight)" stroke-width="1.5" opacity="0.4"/>

  <!-- Architectural 'K' Monogram Graphic with Shadow -->
  <g filter="url(#shadow)">
    <!-- Tower 1: Left Vertical Building Pillar (Stem of 'K') -->
    <polygon points="120,388 120,205 164,165 164,388" fill="url(#goldLinear)"/>
    <polygon points="120,205 142,185 164,165 142,185" fill="url(#goldLight)"/>
    <polygon points="152,180 164,165 164,388 152,388" fill="url(#goldDark)" opacity="0.5"/>

    <!-- Tower 2: Center Skyscraper Pinnacle (Behind Upper Diagonal) -->
    <polygon points="176,388 176,140 193,122 210,140 210,388" fill="url(#goldLinear)"/>
    <polygon points="190,122 196,122 196,75 190,75" fill="url(#goldLight)"/>
    <!-- Windows Facet Strip on Skyscraper -->
    <line x1="193" y1="145" x2="193" y2="380" stroke="#141619" stroke-width="3" stroke-dasharray="7 5" opacity="0.7"/>

    <!-- Tower 3: Upper Right Diagonal Arm of 'K' (Ascending Skyline Bevel) -->
    <polygon points="190,265 315,130 388,130 388,160 252,310" fill="url(#goldLight)"/>
    <polygon points="252,310 388,160 388,188 276,310" fill="url(#goldDark)"/>
    <polygon points="315,130 388,130 360,160 287,160" fill="url(#goldLinear)" opacity="0.9"/>

    <!-- Tower 4: Lower Right Diagonal Arm of 'K' (Plot Base / Commercial Anchor) -->
    <polygon points="252,282 320,360 376,388 322,388 206,335" fill="url(#goldLinear)"/>
    <polygon points="320,360 376,388 340,388 290,360" fill="url(#goldDark)"/>
    <polygon points="376,388 376,330 354,330 354,388" fill="url(#goldLight)" opacity="0.85"/>

    <!-- Subtle Golden Demarcation Lines (Plot Geometry in Negative Space) -->
    <line x1="210" y1="210" x2="252" y2="252" stroke="url(#goldLight)" stroke-width="3" opacity="0.7"/>
    <line x1="210" y1="260" x2="235" y2="285" stroke="url(#goldLight)" stroke-width="3" opacity="0.7"/>
  </g>
</svg>
